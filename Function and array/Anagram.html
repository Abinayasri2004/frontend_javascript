<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = "cat";
        let b = "act";

        let x = a.split("").sort().join("");
        let y = b.split("").sort().join("");

        if(x == y){
            console.log("Anagram");
        }
        else{
            console.log("Not Anagram");
        }
    </script>
</body>
</html>
