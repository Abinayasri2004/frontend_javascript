<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let a = [1,2,3,[4,5,6],[7,8,9]];
        let b = [];
        for(let i=0; i<a.length; i++){
            if(Array.isArray(a[i])){
                for(let j=0; j<a[i].length; j++){
                    b.push(a[i][j]);
                }
            }
            else{
                b.push(a[i]);
            }
        }
        console.log("Flatten Array:", b);

        console.log("Second Array Index 0:", a[3][0]);
        console.log("Second Array Index 2:", a[3][2]);

        console.log("Third Array Index 1:", a[4][1]);
        console.log("Third Array Index 2:", a[4][2]);

    </script>
</body>
</html>
