<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
</head>
<body>
    <script>
        function factorial(num){
            let fact=1;
            for(let i=1; i<=num;i++){
                fact*=i;
            }
            return fact;
        }
        console.log(factorial(6));
    </script>
</body>
</html>
