    <title>Find Largest</title>
</head>
<body>
    <script>
        function findLargest(a,b,c){
            if(a>b && a>c){
                console.log(a+" is largest")
            }
            else if(b>c){
                console.log(b+" is largest")
            }
            else{
               console.log(c+" is largest") 
            }
        }
        findLargest(66,72,93)
    </script>
